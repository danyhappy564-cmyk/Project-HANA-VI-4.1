<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HANA-VI 설정 편집기</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #dfe3ea;
  --accent: #2f6fdf; --accent-weak: #e7efff; --ok: #1f8a4c; --warn: #b7791f; --bad: #c53030;
  --note-bg: #fff8e6; --note-line: #f1d699; --input: #ffffff; --chip: #eef1f5;
  --bad-bg: #fdecec; --warn-bg: #fff6e0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171d; --panel: #1c2028; --text: #e6e9ef; --muted: #98a1b3; --line: #2e3440;
    --accent: #6c9cff; --accent-weak: #22304d; --ok: #4cc38a; --warn: #e0a84b; --bad: #ff6b6b;
    --note-bg: #2a2516; --note-line: #5a4a20; --input: #151920; --chip: #262c37;
    --bad-bg: #3a1d1d; --warn-bg: #3a2e14;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
header h1 { font-size: 16px; margin: 0 12px 0 0; }
header .spacer { flex: 1; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger:hover { border-color: var(--bad); color: var(--bad); }
button.small { padding: 1px 8px; font-size: 12px; }
button:disabled { opacity: .5; cursor: default; }
input[type=text], textarea, select { font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--line); border-radius: 5px; padding: 4px 7px; }
input[type=text]:focus, textarea:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
input:disabled, textarea:disabled { background: var(--chip); color: var(--muted); cursor: not-allowed; }
textarea { width: 100%; font-family: Consolas, "D2Coding", monospace; font-size: 12.5px; }
.invalid { border-color: var(--bad) !important; background: color-mix(in srgb, var(--bad) 8%, var(--input)); }
.layout { display: flex; min-height: calc(100vh - 54px); }
nav { width: 300px; flex-shrink: 0; border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; max-height: calc(100vh - 54px); position: sticky; top: 54px; }
nav .mod { border-bottom: 1px solid var(--line); }
nav .mod > summary { padding: 9px 14px; font-weight: 600; cursor: pointer; }
nav a { display: flex; gap: 6px; align-items: center; padding: 4px 14px 4px 24px; color: var(--text); text-decoration: none; font-size: 13px; }
nav a:hover { background: var(--accent-weak); }
nav a.active { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
nav a.create { color: var(--accent); }
nav a .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--muted); }
nav a .dot.on { background: var(--ok); }
nav a .dirty { color: var(--warn); margin-left: auto; white-space: nowrap; }
nav .group { padding: 6px 14px 2px 24px; font-size: 11.5px; color: var(--muted); }
main { flex: 1; padding: 18px 22px 80px; min-width: 0; max-width: 1100px; }
h2 { margin: 0 0 4px; font-size: 19px; }
.sub { color: var(--muted); margin-bottom: 14px; font-size: 12.5px; word-break: break-all; }
.note { background: var(--note-bg); border: 1px solid var(--note-line); border-radius: 6px; padding: 6px 10px; margin: 6px 0; font-size: 12.5px; white-space: pre-wrap; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 10px 0; }
.card h3 { margin: 0 0 8px; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card h3 .grow { flex: 1; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--chip); color: var(--muted); font-weight: 500; }
.badge.stage-preload { background: #e8f4ff; color: #1c5fa8; }
.badge.stage-trader { background: #f3e8ff; color: #6b2fa8; }
.badge.new { background: var(--warn-bg); color: var(--warn); }
@media (prefers-color-scheme: dark) { .badge.stage-preload { background: #1d3550; color: #9cc8ff; } .badge.stage-trader { background: #34224d; color: #d1b0ff; } }
.field { display: grid; grid-template-columns: 210px 1fr auto; gap: 4px 12px; align-items: start; padding: 4px 0; border-top: 1px dashed var(--line); }
.field:first-child { border-top: 0; }
.field > label { color: var(--muted); font-size: 12.5px; padding-top: 5px; word-break: break-all; }
.field > label b { color: var(--text); font-weight: 600; display: block; }
.field > .x { padding-top: 3px; }
.nested { border-left: 3px solid var(--line); padding-left: 10px; }
.addrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 6px 0 2px; border-top: 1px dashed var(--line); font-size: 12.5px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
.hint.bad { color: var(--bad); }
.name { color: var(--ok); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: #b9c0cc; border-radius: 22px; transition: .15s; cursor: pointer; }
.switch span:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--ok); }
.switch input:checked + span:before { transform: translateX(18px); }
.switch input:disabled + span { opacity: .5; cursor: default; }
table { border-collapse: collapse; width: 100%; }
td, th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
.mono { font-family: Consolas, "D2Coding", monospace; font-size: 12px; }
.muted { color: var(--muted); }
.savebar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 9px 16px; display: none; gap: 10px; align-items: center; z-index: 20; box-shadow: 0 -4px 14px rgba(0,0,0,.08); }
.savebar.show { display: flex; }
.toast { position: fixed; right: 16px; bottom: 64px; max-width: 560px; background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 8px; z-index: 40; white-space: pre-wrap; display: none; }
.toast.show { display: block; }
pre.log { background: var(--input); border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 55vh; overflow: auto; font-size: 12px; white-space: pre-wrap; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0 4px; }
details.ids summary { cursor: pointer; font-size: 12px; color: var(--muted); }
details.ids div { font-size: 12px; }
input.num { width: 140px; }
input.wide { width: 100%; }
.check { border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 12.5px; }
.check.bad { background: var(--bad-bg); border: 1px solid var(--bad); }
.check.warn { background: var(--warn-bg); border: 1px solid var(--warn); }
.check.ok { background: var(--chip); color: var(--muted); }
.check ul { margin: 4px 0 0; padding-left: 18px; }
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; display: flex; align-items: flex-start; justify-content: center; padding-top: 8vh; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(720px, calc(100vw - 32px)); max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.modal header { position: static; border-radius: 10px 10px 0 0; }
.modal .results { overflow-y: auto; padding: 4px 0; }
.modal .results div { padding: 5px 16px; cursor: pointer; display: flex; gap: 10px; }
.modal .results div:hover { background: var(--accent-weak); }
.recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.recipes button { text-align: left; padding: 8px 10px; }
.recipes button small { display: block; color: var(--muted); font-size: 11.5px; }
@media (max-width: 820px) {
  .layout { display: block; } nav { width: auto; position: static; max-height: 40vh; }
  .field { grid-template-columns: 1fr auto; } .field > label { grid-column: 1 / -1; }
}
</style>
</head>

const state = {
  info: null,
  files: [],          // [{mod, path}]
  docs: {},           // path -> {text, data, trailingNewline, dirty, error, isNew, kind}
  names: {},          // 아이템 ID(소문자) -> 이름
  view: null,
};

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: { "X-Editor-Token": TOKEN, "Content-Type": "text/plain; charset=utf-8" }, body,
  });
  const ct = res.headers.get("content-type") || "";
  const data = ct.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
  return data;
}

const isLocalePath = p => p.includes("/locales/global/");

async function loadDoc(path) {
  if (state.docs[path]) return state.docs[path];
  const text = await api("GET", "/api/file?path=" + encodeURIComponent(path));
  const doc = { text, trailingNewline: text.endsWith("\n"), dirty: false, error: null, data: null, kind: isLocalePath(path) ? "locale" : "json", edits: {} };
  try { doc.data = JSON.parse(text); } catch (e) { doc.error = "JSON 문법 오류: " + e.message; }
  state.docs[path] = doc;
  return doc;
}

function serialize(doc) {
  if (doc.kind === "locale") return applyLocaleEdits(doc);
  return JSON.stringify(doc.data, null, 2) + (doc.trailingNewline ? "\n" : "");
}

function markDirty(path) {
  const doc = state.docs[path];
  doc.dirty = doc.isNew || serialize(doc) !== doc.text;
  refreshSaveBar();
  refreshNavFlags();
}

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}

function toast(msg, ms = 3500) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms);
}

// 몽고 ID 와 같은 모양(앞 8자리 = 시각)의 새 24자리 ID. 이미 쓰인 ID 와 겹치면 다시 뽑는다.
function newMongoId() {
  for (;;) {
    const t = Math.floor(Date.now() / 1000).toString(16).padStart(8, "0");
    const r = Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, "0")).join("");
    const id = t + r;
    if (!state.names[id] && !usedIds().has(id)) return id;
  }
}
function usedIds() {
  const s = new Set();
  for (const d of Object.values(state.docs)) for (const op of d?.data?.ops || []) { if (op.newId) s.add(String(op.newId).toLowerCase()); }
  return s;
}

const localePath = (mod, lang) => `4.1/${mod}/mod/db/locales/global/${lang}.json`;

function nameOf(id) {
  if (typeof id !== "string") return null;
  return TRADERS[id] || CURRENCIES[id] || state.names[id.toLowerCase()] || null;

// 아이템 이름 불러오기 (모드 로케일 + 설치된 SPT 의 kr.json)
// ---------------------------------------------------------------------------
function absorbLocale(obj, overwrite) {
  if (!obj || typeof obj !== "object") return;
  for (const [k, v] of Object.entries(obj)) {
    if (typeof v !== "string") continue;
    let id = null;
    if (k.endsWith(" Name")) id = k.slice(0, -5);
    else if (ID_RE.test(k)) id = k;           // 도감 분류 등은 "ID": "이름" 으로 들어 있다
    if (!id || !ID_RE.test(id)) continue;
    id = id.toLowerCase();
    if (overwrite || !state.names[id]) state.names[id] = v;
  }
}

async function loadNames() {
  if (state.info.gameLocale) {
    try { absorbLocale(await api("GET", "/api/gamelocale?lang=kr"), true); } catch { /* 없으면 ID 만 표시 */ }
  }
  const locs = state.files.filter(f => isLocalePath(f.path));
  locs.sort((a, b) => (baseName(a.path) === "kr.json" ? -1 : 1) - (baseName(b.path) === "kr.json" ? -1 : 1));
  for (const f of locs) {
    try { const d = await loadDoc(f.path); absorbLocale(d.data, false); } catch { }
  }
  for (const f of state.files.filter(f => f.path.includes("/db/patches/"))) {
    const d = state.docs[f.path]; if (!d || !d.data) continue;
    for (const op of d.data.ops || []) {
      const id = op.newId || op.id;
      if (op._name && typeof id === "string" && !state.names[id.toLowerCase()]) state.names[id.toLowerCase()] = op._name;
    }
  }
}

// ---------------------------------------------------------------------------
// 로케일(아이템 이름표) — 파일마다 줄 모양이 달라서, 바꾼 줄만 고치고 새 줄은 끝에 붙인다
// ---------------------------------------------------------------------------
function findLocaleKey(doc, key) {
  if (!doc.data) return key;
  if (key in doc.data) return key;
  const low = key.toLowerCase();
  return Object.keys(doc.data).find(k => k.toLowerCase() === low) || key;
}

function getLocaleDoc(mod, lang, create) {
  const path = localePath(mod, lang);
  let doc = state.docs[path];
  if (!doc && create) {
    doc = state.docs[path] = { text: "", trailingNewline: true, dirty: false, error: null, data: {}, kind: "locale", edits: {}, isNew: true };
    if (!state.files.some(f => f.path === path)) state.files.push({ mod, path });
  }
  return doc;
}

function setLocale(mod, lang, key, value) {
  const doc = getLocaleDoc(mod, lang, true);
  const real = findLocaleKey(doc, key);
  doc.edits[real] = value;
  doc.data[real] = value;
  markDirty(localePath(mod, lang));
}

// 패치를 지울 때 그 패치가 만든 아이템의 이름 줄도 지운다. 바뀐 로케일 파일 경로 목록을 돌려준다.
function removeLocaleFor(mod, ids) {
  const changed = [];
  for (const lang of ["kr", "en"]) {
    const doc = getLocaleDoc(mod, lang, false);
    if (!doc?.data) continue;
    let hit = false;
    for (const id of ids) for (const part of ["Name", "ShortName", "Description"]) {
      const real = findLocaleKey(doc, `${id} ${part}`);
      if (real in doc.data) { delete doc.data[real]; doc.edits[real] = null; hit = true; }
    }
    if (hit) { markDirty(localePath(mod, lang)); changed.push(localePath(mod, lang)); }
  }
  return changed;
}

function applyLocaleEdits(doc) {
  const edits = Object.entries(doc.edits || {});
  if (!edits.length) return doc.text;
  const build = () => JSON.stringify(doc.data, null, 2) + "\n";
  if (!doc.text.trim() && !Object.keys(doc.data).length) return "{}\n";
  if (!doc.text.trim()) return build();
  const nl = doc.text.includes("\r\n") ? "\r\n" : "\n";
  const lines = doc.text.split(/\r?\n/);
  const left = new Map(edits);
  const re = /^(\s*)("(?:[^"\\]|\\.)*")(\s*:\s*)"(?:[^"\\]|\\.)*"(\s*,?\s*)$/;
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(re); if (!m) continue;
    let k; try { k = JSON.parse(m[2]); } catch { continue; }
    if (!left.has(k)) continue;
    const v = left.get(k);
    left.delete(k);
    if (v === null) {
      // 줄 삭제. 지운 줄이 마지막 항목이었으면 앞 항목의 쉼표를 뗀다
      const hadComma = m[4].includes(",");
      lines.splice(i, 1); i--;
      if (!hadComma) { let j = i; while (j >= 0 && lines[j].trim() === "") j--; if (j >= 0) lines[j] = lines[j].replace(/,\s*$/, ""); }
      continue;
    }
    lines[i] = m[1] + m[2] + m[3] + JSON.stringify(v) + m[4];
  }
  for (const [k, v] of left) if (v === null) left.delete(k);
  if (edits.some(([, v]) => v === null)) {
    // 지우고 남은 빈 줄 정리: 닫는 } 바로 앞의 빈 줄, 연달아 있는 빈 줄
    for (let i = lines.length - 1; i > 0; i--) {
      const next = lines.slice(i + 1).find(l => l.trim() !== "");
      if (lines[i].trim() === "" && (lines[i - 1].trim() === "" || next?.trim() === "}")) lines.splice(i, 1);
    }
  }
  if (left.size) {
    let close = lines.length - 1;
    while (close >= 0 && lines[close].trim() === "") close--;
    let last = close - 1;
    while (last >= 0 && lines[last].trim() === "") last--;
    if (last >= 0 && lines[last].trim() !== "{" && !lines[last].trimEnd().endsWith(",")) lines[last] = lines[last].replace(/\s*$/, "") + ",";
    const indent = (lines.find(l => /^\s*"/.test(l)) || "  ").match(/^\s*/)[0];
    const add = [...left].map(([k, v], i, all) => indent + JSON.stringify(k) + ": " + JSON.stringify(v) + (i < all.length - 1 ? "," : ""));
    lines.splice(close, 0, "", ...add);
  }
  const out = lines.join(nl);
  try {
    const parsed = JSON.parse(out);
    const sorted = o => JSON.stringify(Object.keys(o).sort().map(k => [k, o[k]]));
    if (sorted(parsed) === sorted(doc.data)) return out;
  } catch { }
  return build();   // 줄 단위로 못 고치는 모양이면 통째로 다시 쓴다
}

function checkPatch(path) {
  const doc = state.docs[path];
  const errs = [], warns = [];
  if (!doc || doc.error || !doc.data) return { errs: [doc?.error || "읽지 못함"], warns };
  const d = doc.data, mod = modOf(path);
  const cfg = state.docs[fileOf(mod, "config.json")]?.data;
  const ammo = state.docs[fileOf(mod, "db/ammo.json")]?.data || {};
  const values = state.docs[fileOf(mod, "db/values.json")]?.data || {};
  const sets = d.sets || {};
  const E = m => errs.push(m), W = m => warns.push(m);

  if (!d.key) E("key 가 없습니다");
  else if (!/^[A-Za-z0-9_]+$/.test(d.key)) E(`key '${d.key}' 에는 영문·숫자·_ 만 쓸 수 있습니다`);
  for (const p of patchFiles(mod)) if (p !== path && state.docs[p]?.data?.key === d.key) E(`key '${d.key}' 가 ${baseName(p)} 와 겹칩니다`);
  if (cfg?.patches && d.key && !(d.key in cfg.patches)) E(`key '${d.key}' 가 config.json 의 patches 에 없습니다`);
  for (const [n, vals] of Object.entries(sets)) for (const v of vals || []) if (!ID_RE.test(v)) E(`ID 묶음 ${n} 의 '${v}' 는 24자리 ID 가 아닙니다`);

  const resolve = (val, tag) => {
    const toks = typeof val === "string" ? [val] : Array.isArray(val) ? val : [];
    const out = [];
    for (const t of toks) {
      if (typeof t !== "string") { E(`${tag} 에 글자가 아닌 값이 있습니다`); continue; }
      if (t.startsWith("@")) { const s = sets[t.slice(1)] || ammo[t.slice(1)]; if (s) out.push(...s); else E(`${tag} 의 '${t}' 묶음을 찾을 수 없습니다`); }
      else out.push(t);
    }
    return out;
  };
  const checkVals = (obj, tag) => { for (const [n, v] of Object.entries(obj || {})) if (typeof v === "string" && v.startsWith("$") && !(v.slice(1) in values)) E(`${tag}: '${v}' 를 values.json 에서 찾을 수 없습니다`); };
  const checkPropNames = (obj, tag) => { for (const n of Object.keys(obj || {})) if (!PROP_LOWER[n.toLowerCase()]) W(`${tag}: '${n}' 은(는) SPT 아이템 속성에 없는 이름입니다 (오타가 아닌지 확인)`); };

  const newIds = new Map();
  (d.ops || []).forEach((op, i) => {
    const tag = `#${i + 1} ${OP_NAMES[op.op] || op.op}`;
    const kind = op.op;
    if (!OP_SCHEMA[kind]) { E(`${tag}: 모르는 작업 종류 '${kind}'`); return; }
    if (op.stage && !["preload", "postload", "trader"].includes(op.stage)) E(`${tag}: 모르는 stage '${op.stage}'`);
    const tcount = [op.targets && (Array.isArray(op.targets) ? op.targets.length : true), op.targetsByParent?.length, op.targetsAll, op.targetsByBaseClass?.length].filter(Boolean).length;
    if (OP_SCHEMA[kind].targets && tcount !== 1) E(`${tag}: 대상을 정확히 한 가지로 지정해야 합니다 (지금 ${tcount}가지)`);
    for (const f of ["targetsByParent", "targetsByBaseClass", "whenFilterContains"]) for (const v of op[f] || []) if (!ID_RE.test(v)) E(`${tag}: ${KEY_LABELS[f]} 의 '${v}' 는 24자리 ID 가 아닙니다`);
    for (const f of ["targets", "add"]) if (f in op) for (const v of resolve(op[f], `${tag} ${KEY_LABELS[f]}`)) if (!ID_RE.test(v)) E(`${tag}: ${KEY_LABELS[f]} 의 '${v}' 는 24자리 ID 가 아닙니다`);

    if (["setProps", "adjustProps", "appendProps"].includes(kind)) {
      if (!op.props || !Object.keys(op.props).length) E(`${tag}: 바꿀 값이 하나도 없습니다`);
      checkPropNames(op.props, tag); checkVals(op.props, tag);
      if (kind === "appendProps") for (const [n, v] of Object.entries(op.props || {})) if (!Array.isArray(v)) E(`${tag}: '${n}' 값은 목록이어야 합니다`);
      if (kind === "adjustProps") for (const [n, v] of Object.entries(op.props || {})) if (typeof v !== "number" && !(typeof v === "string" && v.startsWith("$"))) E(`${tag}: '${n}' 는 더할 숫자여야 합니다`);
    }
    if (kind === "addFilter") {
      if (!["slot", "chamber", "cartridge", "grid"].includes(op.into || "slot")) E(`${tag}: '어디에 추가' 값이 잘못됐습니다`);
      for (const n of Object.keys(op.slotProps || {})) if (!(n in SLOT_PROPS)) E(`${tag}: 슬롯에 '${n}' 값이 없습니다`);
      if (!(op.add?.length) && !(op.slotProps && Object.keys(op.slotProps).length) && !op.replace) E(`${tag}: 추가할 아이템이 비어 있어 아무 일도 하지 않습니다`);
      if ((op.into || "slot") === "slot" && !(op.slots?.length || op.slotIndexes?.length)) W(`${tag}: 슬롯 이름이 비어 있어 그 아이템의 '모든 슬롯' 에 적용됩니다`);
    }
    if (kind === "cloneItem") {
      checkPropNames(op.props, tag); checkVals(op.props, tag);
      if (op.stage !== "preload") E(`${tag}: stage 가 preload 가 아니면 서버가 죽습니다`);
      for (const f of ["from", "newId"]) if (!ID_RE.test(op[f] || "")) E(`${tag}: ${KEY_LABELS[f]} 가 24자리 ID 가 아닙니다`);
      if (op.newParentId && !ID_RE.test(op.newParentId)) E(`${tag}: 새 아이템 분류가 24자리 ID 가 아닙니다`);
      if (op.newId) {
        const low = op.newId.toLowerCase();
        if (newIds.has(low)) E(`${tag}: 새 아이템 ID 가 ${newIds.get(low)} 과 겹칩니다`); else newIds.set(low, tag);
        const allOps = patchFiles(mod).flatMap(p => (state.docs[p]?.data?.ops || []).map(o => ({ o, p })));
        if (!allOps.some(({ o }) => o.op === "handbookEntry" && String(o.id).toLowerCase() === low)) W(`${tag}: 이 새 아이템의 도감 등록(가격) 작업이 없습니다 — 상인·플리마켓 가격이 0 이 될 수 있습니다`);
        if (!["kr", "en"].some(l => { const ld = state.docs[localePath(mod, l)]; return ld?.data && findLocaleKey(ld, op.newId + " Name") in ld.data; }))
          W(`${tag}: 게임에 보일 이름이 없습니다 — 아래 '게임에 보일 이름' 칸을 채우세요`);
      }
    }
    if (kind === "handbookEntry" || kind === "traderOffer") {
      for (const f of ["id", "parentId", "traderId", "currency"]) if (f in op && !ID_RE.test(op[f] || "")) E(`${tag}: ${KEY_LABELS[f]} 가 24자리 ID 가 아닙니다`);
      if (kind === "handbookEntry" && op.stage !== "preload") E(`${tag}: stage 는 preload 여야 합니다`);
      if (kind === "traderOffer" && op.stage !== "trader") E(`${tag}: stage 는 trader 여야 합니다 (아니면 조용히 안 팔립니다)`);
    }
    if (kind === "questWeapons") { if (!ID_RE.test(op.questId || "")) E(`${tag}: 퀘스트 ID 가 24자리 ID 가 아닙니다`); if (!op.add?.length) E(`${tag}: 추가할 무기가 비어 있습니다`); }
    if (kind === "masteryTemplates" && !op.masteryName) E(`${tag}: 숙련도 이름이 없습니다`);
    if (kind === "addPreset") { if (op.stage !== "preload") E(`${tag}: stage 는 preload 여야 합니다`); if (!op.preset || !Object.keys(op.preset).length) E(`${tag}: 프리셋 내용이 비어 있습니다`); }
  });
  return { errs, warns };
}

function checkConfig(mod) {
  const errs = [];
  const cfg = state.docs[fileOf(mod, "config.json")]?.data;
  if (!cfg?.patches) return errs;
  const keys = new Set(patchFiles(mod).map(p => state.docs[p]?.data?.key));
  for (const k of Object.keys(cfg.patches)) if (!keys.has(k)) errs.push(`config.json 의 '${k}' 에 해당하는 패치 파일이 없습니다`);
  return errs;
}

function checkBox(path) {
  const { errs, warns } = checkPatch(path);
  if (!errs.length && !warns.length) return el("div", { class: "check ok" }, "✔ 검사 통과 — 문제 없음");
  const box = el("div", { class: "check " + (errs.length ? "bad" : "warn") },
    el("b", null, errs.length ? `✖ 오류 ${errs.length}건 — 이대로면 서버에서 안 되거나 죽습니다` : `⚠ 확인할 것 ${warns.length}건`));
  const ul = el("ul");
  for (const e of errs) ul.append(el("li", null, e));
  for (const w of warns) ul.append(el("li", { class: "muted" }, w));
  box.append(ul);
  return box;
}

// ---------------------------------------------------------------------------
// 왼쪽 메뉴
// ---------------------------------------------------------------------------
function effectivePatchOn(mod, patchDoc) {
  const cfg = state.docs[fileOf(mod, "config.json")];
  const key = patchDoc.data?.key;
  if (cfg?.data?.patches && key in cfg.data.patches) return !!cfg.data.patches[key];
  return !!patchDoc.data?.enabled;
}

function buildNav() {
  const nav = document.getElementById("nav");
  const openState = {};
  for (const d of nav.querySelectorAll("details.mod")) openState[d.dataset.mod] = d.open;
  nav.innerHTML = "";
  const mods = [...new Set(state.files.map(f => f.mod))];
  for (const mod of mods) {
    const det = el("details", { class: "mod", "data-mod": mod, open: openState[mod] ?? true }, el("summary", null, mod));
    const add = (view, label, path, dot, cls) => {
      det.append(el("a", { href: "#", class: cls || "", "data-view": JSON.stringify(view), "data-path": path || "",
        onclick: ev => { ev.preventDefault(); show(view); } },
        dot === undefined ? null : el("span", { class: "dot" + (dot ? " on" : "") }), label, el("span", { class: "dirty" })));
    };
    if (fileOf(mod, "config.json")) add({ kind: "config", mod }, "기본 설정 · 패치 켜기/끄기", fileOf(mod, "config.json"));
    if (fileOf(mod, "db/values.json")) add({ kind: "generic", path: fileOf(mod, "db/values.json") }, "공용 수치 (values.json)", fileOf(mod, "db/values.json"));
    if (fileOf(mod, "db/packs.json")) add({ kind: "packs", path: fileOf(mod, "db/packs.json") }, "아이템 팩 켜기/끄기", fileOf(mod, "db/packs.json"));
    if (fileOf(mod, "db/ammo.json")) add({ kind: "generic", path: fileOf(mod, "db/ammo.json") }, "공용 ID 묶음 (ammo.json)", fileOf(mod, "db/ammo.json"));
    // 패치를 쓰는 모드(config.json 에 patches 가 있는 모드)만 패치 목록·새 패치 메뉴를 보여 준다
    const pf = patchFiles(mod);
    if (pf.length || state.docs[fileOf(mod, "config.json")]?.data?.patches) {
      det.append(el("div", { class: "group" }, `패치 파일 ${pf.length}개`));
      for (const p of pf) {
        const d = state.docs[p];
        add({ kind: "patch", path: p }, d?.data?.title || baseName(p), p, d?.data ? effectivePatchOn(mod, d) : false);
      }
      add({ kind: "newpatch", mod }, "＋ 새 패치 만들기", "", undefined, "create");
    }
    nav.append(det);
  }
  refreshNavFlags();
}

function refreshNavFlags() {
  for (const a of document.querySelectorAll("nav a")) {
    const p = a.dataset.path;
    const d = p && state.docs[p];
    const dirtyEl = a.querySelector(".dirty");
    if (dirtyEl) dirtyEl.textContent = d && d.dirty ? (d.isNew ? "● 새 파일" : "● 수정됨") : "";
    const v = JSON.parse(a.dataset.view);
    a.classList.toggle("active", JSON.stringify(state.view) === a.dataset.view);
    if (v.kind === "patch" && d?.data) a.querySelector(".dot")?.classList.toggle("on", effectivePatchOn(modOf(p), d));
  }
}

function refreshSaveBar() {
  const dirty = Object.entries(state.docs).filter(([, d]) => d.dirty);
  const bar = document.getElementById("savebar");
  bar.classList.toggle("show", dirty.length > 0);
  document.getElementById("dirtyCount").textContent = `저장 안 된 파일 ${dirty.length}개`;
  document.getElementById("dirtyList").textContent = dirty.map(([p]) => modOf(p) + "/" + baseName(p)).join(", ");
}

// 구조가 바뀌었을 때(추가·삭제·이동) 같은 화면을 스크롤 위치 그대로 다시 그린다
function rerender() { const y = window.scrollY; show(state.view, true).then(() => window.scrollTo(0, y)); }

// ---------------------------------------------------------------------------
// 아이템 찾기 창
// ---------------------------------------------------------------------------
function openItemSearch(onPick, initial) {
  const back = el("div", { class: "modal-back", onclick: e => { if (e.target === back) back.remove(); } });
  const input = el("input", { type: "text", placeholder: "아이템 이름 또는 ID 일부 (예: 탄창, AK-74, 5448bc)", style: "flex:1", value: initial || "" });
  const results = el("div", { class: "results" });
  const unique = [...new Map(Object.entries(state.names)).entries()];
  const info = state.info.gameLocale ? "" : "SPT 원본 아이템 이름 파일을 못 찾아서 모드가 추가한 아이템만 검색됩니다 (SPT 경로 설정 확인)";
  const run = () => {
    const q = input.value.trim().toLowerCase();
    results.innerHTML = "";
    if (!q) { results.append(el("div", { class: "muted" }, info || "검색어를 넣으세요")); return; }
    const hits = [];
    for (const [id, name] of unique) {
      if (id.startsWith(q) || name.toLowerCase().includes(q)) hits.push([id, name]);
      if (hits.length >= 150) break;
    }
    for (const [cid, cname] of [...Object.entries(TRADERS), ...Object.entries(CURRENCIES)]) if (cname.includes(q)) hits.unshift([cid, cname]);
    if (!hits.length) results.append(el("div", { class: "muted" }, "찾은 것이 없습니다" + (info ? " — " + info : "")));
    for (const [id, name] of hits) results.append(el("div", { onclick: () => { onPick(id, name); back.remove(); } }, el("span", { class: "mono muted" }, id), el("span", null, name)));
  };
  input.addEventListener("input", run);
  input.addEventListener("keydown", e => { if (e.key === "Escape") back.remove(); });
  back.append(el("div", { class: "modal" }, el("header", null, input, el("button", { onclick: () => back.remove() }, "닫기")), results));
  document.body.append(back);
  input.focus(); run();
}

// ---------------------------------------------------------------------------
// 값 편집 위젯
// ---------------------------------------------------------------------------
function labelFor(key) {
  const k = String(key);
  return KEY_LABELS[k] ? el("label", null, el("b", null, KEY_LABELS[k]), k) : el("label", null, el("b", null, k));
}

function refHint(path, value) {
  if (typeof value !== "string") return null;
  const mod = modOf(path);
  if (value.startsWith("$")) {
    const vals = state.docs[fileOf(mod, "db/values.json")]?.data;
    const v = vals ? vals[value.slice(1)] : undefined;
    return el("div", { class: v === undefined ? "hint bad" : "hint" }, v === undefined ? "공용 수치 참조 — values.json 에 없음!" : `공용 수치 참조 → 현재 값 ${v} (공용 수치 메뉴에서 수정)`);
  }
  if (value.startsWith("@")) {
    const doc = state.docs[path]?.data;
    const own = doc?.sets?.[value.slice(1)];
    const shared = state.docs[fileOf(mod, "db/ammo.json")]?.data?.[value.slice(1)];
    const set = own || shared;
    return el("div", { class: set ? "hint" : "hint bad" }, set ? `ID 묶음 참조 → ${set.length}개 (${own ? "이 파일의 묶음" : "ammo.json"})` : "ID 묶음을 찾지 못함!");
  }
  if (ID_RE.test(value)) {
    const n = nameOf(value);
    return n ? el("div", { class: "hint name" }, n) : el("div", { class: "hint" }, "(이름 모름 — 모드 아이템이거나 다른 모드의 아이템)");
  }
  return null;
}

function validId(orig, v, forceId) {
  if (forceId || (typeof orig === "string" && ID_RE.test(orig))) return ID_RE.test(v) || v.startsWith("@") || v.startsWith("$");
  return true;
}

function selectEditor(path, parent, key, options) {
  const sel = el("select");
  const cur = parent[key];
  const entries = Object.entries(options);
  if (!(cur in options)) entries.unshift([cur, `(직접 입력된 값) ${cur}`]);
  for (const [v, label] of entries) { const o = el("option", { value: v }, label); if (v === cur) o.selected = true; sel.append(o); }
  sel.addEventListener("change", () => { parent[key] = sel.value; markDirty(path); });
  return sel;
}

function primitiveEditor(path, parent, key, opts = {}) {
  const value = parent[key];
  const readOnly = opts.readOnly;
  const wrap = el("div");
  if (key === "traderId" && !readOnly) { wrap.append(selectEditor(path, parent, key, TRADERS)); return wrap; }
  if (key === "currency" && !readOnly) { wrap.append(selectEditor(path, parent, key, CURRENCIES)); return wrap; }
  if (key === "into" && !readOnly) {
    const sel = selectEditor(path, parent, key, Object.fromEntries(Object.entries(VALUE_HINTS.into).map(([k, v]) => [k, `${v} (${k})`])));
    sel.addEventListener("change", () => rerender());
    wrap.append(sel); return wrap;
  }
  if (typeof value === "boolean") {
    const cb = el("input", { type: "checkbox", disabled: readOnly });
    cb.checked = value;
    const txt = el("span", { class: "muted" }, value ? "켜짐" : "꺼짐");
    cb.addEventListener("change", () => { parent[key] = cb.checked; txt.textContent = cb.checked ? "켜짐" : "꺼짐"; markDirty(path); });
    wrap.append(el("div", { class: "row" }, el("label", { class: "switch" }, cb, el("span")), txt));
    return wrap;
  }
  if (value === null) { wrap.append(el("span", { class: "muted" }, "(비어 있음)")); return wrap; }
  if (typeof value === "number") {
    const inp = el("input", { type: "text", class: "num", inputmode: "decimal", value: String(value), disabled: readOnly });
    const msg = el("div", { class: "hint bad" });
    inp.addEventListener("input", () => {
      const t = inp.value.trim();
      const n = Number(t);
      const ok = t !== "" && Number.isFinite(n);
      inp.classList.toggle("invalid", !ok);
      msg.textContent = ok ? "" : "숫자만 넣을 수 있습니다 (이 칸은 저장되지 않음)";
      if (ok) { parent[key] = n; markDirty(path); }
    });
    wrap.append(inp, msg);
    return wrap;
  }
  // 문자열
  const orig = value;
  const forceId = opts.idSingle;
  const isColor = COLOR_RE.test(value);
  const inp = el("input", { type: "text", class: isColor ? "" : "wide", value, disabled: readOnly, spellcheck: "false" });
  const hintBox = el("div");
  const setHint = v => {
    hintBox.innerHTML = "";
    if (key === "newId" && !nameOf(v)) { hintBox.append(el("div", { class: "hint" }, "새로 만드는 아이템의 ID (자동으로 뽑음) — 이름은 아래 '게임에 보일 이름' 에서 정합니다")); return; }
    const h = refHint(path, v); if (h) hintBox.append(h);
    const vh = VALUE_HINTS[key]?.[v]; if (vh) hintBox.append(el("div", { class: "hint" }, vh));
  };
  let picker = null;
  if (isColor) {
    picker = el("input", { type: "color", value, disabled: readOnly });
    picker.addEventListener("input", () => { inp.value = picker.value.toUpperCase(); inp.dispatchEvent(new Event("input")); });
  }
  inp.addEventListener("input", () => {
    const v = inp.value.trim();
    const ok = v === "" && forceId ? false : validId(orig, v, forceId);
    inp.classList.toggle("invalid", !ok);
    if (!ok) { hintBox.innerHTML = ""; hintBox.append(el("div", { class: "hint bad" }, "아이템 ID 는 24자리 16진수여야 합니다 (🔍 로 찾을 수 있습니다)")); }
    parent[key] = v;               // 빈칸·틀린 ID 도 일단 넣고, 저장 전 검사에서 막는다
    if (ok) { if (picker && COLOR_RE.test(v)) picker.value = v; setHint(v); }
    markDirty(path);
    opts.onChange?.(v);
  });
  setHint(value);
  const row = el("div", { class: "row", style: "flex-wrap:nowrap" }, picker, inp);
  if ((forceId || ID_RE.test(orig)) && !readOnly) {
    row.append(el("button", { class: "small", title: "아이템 이름으로 찾기", onclick: () => openItemSearch(id => { inp.value = id; inp.dispatchEvent(new Event("input")); }) }, "🔍"));
  }
  wrap.append(row, hintBox);
  if (forceId && value === "" && !readOnly) inp.classList.add("invalid");
  return wrap;
}

function listEditor(path, parent, key, opts = {}) {
  const arr = parent[key];
  const readOnly = opts.readOnly;
  const numeric = opts.numeric || (arr.length > 0 && arr.every(x => typeof x === "number"));
  const idMode = opts.idList || arr.some(x => typeof x === "string" && ID_RE.test(x));
  const ta = el("textarea", { rows: Math.min(Math.max(arr.length, 2), 12), disabled: readOnly, spellcheck: "false" });
  ta.value = arr.join("\n");
  const msg = el("div", { class: "hint bad" });
  const names = el("details", { class: "ids" });
  const renderNames = () => {
    const ids = parent[key].filter(x => typeof x === "string" && (ID_RE.test(x) || x.startsWith("@") || x.startsWith("$")));
    names.innerHTML = "";
    if (!ids.length) return;
    names.append(el("summary", null, `이름 보기 (${ids.length}개)`));
    const box = el("div");
    for (const id of ids) {
      const h = refHint(path, id);
      box.append(el("div", null, el("span", { class: "mono" }, id), " ", h ? h.textContent : ""));
    }
    names.append(box);
  };
  ta.addEventListener("input", () => {
    const lines = ta.value.split(/\r?\n/).map(s => s.trim()).filter(s => s !== "");
    let bad = null;
    let out = lines;
    if (numeric) {
      out = lines.map(Number);
      if (out.some(n => !Number.isFinite(n))) bad = "숫자만 한 줄에 하나씩 넣으세요";
    } else if (idMode) {
      const wrong = lines.find(s => !(ID_RE.test(s) || s.startsWith("@") || s.startsWith("$")));
      if (wrong) bad = `아이템 ID 가 아닌 줄이 있습니다: "${wrong}"`;
    }
    ta.classList.toggle("invalid", !!bad);
    msg.textContent = bad ? bad + " (이 칸은 저장되지 않음)" : "";
    if (bad) return;
    parent[key] = out;
    renderNames();
    markDirty(path);
  });
  renderNames();
  const tools = el("div", { class: "row" }, el("span", { class: "hint" }, idMode ? "한 줄에 ID 하나 (@묶음이름 도 가능)" : "한 줄에 하나씩"));
  if (idMode && !readOnly) tools.append(el("button", { class: "small", onclick: () => openItemSearch(id => {
    ta.value = (ta.value.trim() ? ta.value.trim() + "\n" : "") + id; ta.dispatchEvent(new Event("input"));
  }) }, "🔍 찾아서 추가"));
  return el("div", null, ta, tools, msg, names);
}

function rawEditor(path, parent, key) {
  const ta = el("textarea", { rows: 6, spellcheck: "false" });
  ta.value = JSON.stringify(parent[key], null, 2);
  const msg = el("div", { class: "hint bad" });
  ta.addEventListener("input", () => {
    try { parent[key] = JSON.parse(ta.value); ta.classList.remove("invalid"); msg.textContent = ""; markDirty(path); }
    catch (e) { ta.classList.add("invalid"); msg.textContent = "JSON 문법 오류 (이 칸은 저장되지 않음): " + e.message; }
  });
  return el("div", null, ta, el("div", { class: "hint" }, "JSON 형식 그대로 편집"), msg);
}

function valueEditor(path, parent, key, opts = {}) {
  const v = parent[key];
  if (opts.raw) return rawEditor(path, parent, key);
  if (Array.isArray(v)) {
    if (v.every(x => x === null || typeof x !== "object")) return listEditor(path, parent, key, opts);
    if (v.every(x => x && typeof x === "object" && !Array.isArray(x))) {
      const box = el("div", { class: "nested" });
      v.forEach((_, i) => box.append(el("div", { class: "muted" }, `${i + 1}번째`), objectEditor(path, v, i)));
      return box;
    }
    return rawEditor(path, parent, key);
  }
  if (v && typeof v === "object") return el("div", { class: "nested" }, objectEditor(path, parent, key, opts.childObj || {}));
  return primitiveEditor(path, parent, key, opts);
}

// 값 종류 글자 → 새 값의 기본 모양
function defaultFor(kind) {
  return { n: 0, b: true, s: "", i: "", l: [], a: [], o: {} }[kind] ?? "";
}

/**
 * 객체 하나를 칸들로 그린다.
 * opts.skip: 안 그릴 키 / opts.readOnly: 잠글 키 / opts.removable(k): ✕ 를 붙일지
 * opts.addKind: "props" | "slotProps" | "free" | "sets" — 맨 아래에 "값 추가" 줄을 붙인다
 * opts.childOpts(k): 그 키의 편집기 옵션
 */
function objectEditor(path, parent, key, opts = {}) {
  const obj = parent[key];
  const box = el("div");
  const skip = opts.skip || new Set();
  for (const k of Object.keys(obj)) {
    if (skip.has(k)) continue;
    // "_" 로 시작하는 키는 메모(_note, _comment …)라 글로만 보여 준다. 슬롯 값(_max_count, _parent)은 예외.
    if (k.startsWith("_") && !(opts.underscoreFields && k in SLOT_PROPS) && !(k in SLOT_PROPS && typeof obj[k] !== "string") && k !== "_max_count" && k !== "_parent") {
      const val = obj[k];
      box.append(el("div", { class: "note" }, (Array.isArray(val) ? val.join("\n") : typeof val === "object" ? JSON.stringify(val) : String(val))));
      continue;
    }
    const ro = READONLY_KEYS.has(k) || (opts.readOnly && opts.readOnly.has(k));
    const child = { readOnly: ro, idSingle: ID_SINGLE.has(k), idList: ID_LIST.has(k) || opts.addKind === "sets", ...(opts.childOpts?.(k) || {}) };
    const x = opts.removable?.(k)
      ? el("button", { class: "small danger x", title: "이 항목 지우기", onclick: () => { delete obj[k]; markDirty(path); rerender(); } }, "✕")
      : el("span");
    box.append(el("div", { class: "field" }, labelFor(k), valueEditor(path, obj, k, child), x));
  }
  if (opts.addKind) box.append(addRow(path, obj, opts.addKind));
  return box;
}

function addRow(path, obj, kind) {
  const name = el("input", { type: "text", placeholder: kind === "sets" ? "묶음 이름 (영문)" : kind === "slotProps" ? "슬롯 값 이름" : "속성 이름 (예: Weight)", style: "width:240px",
    list: kind === "slotProps" ? "dl-slotprops" : kind === "sets" ? null : "dl-props", spellcheck: "false" });
  const type = el("select", null, ...Object.entries({ n: "숫자", s: "글자", b: "켜기/끄기", i: "아이템 ID", l: "목록", o: "묶음(JSON)" }).map(([v, l]) => el("option", { value: v }, l)));
  const hint = el("span", { class: "muted" });
  const known = () => {
    const n = name.value.trim();
    if (kind === "slotProps") return SLOT_PROPS[n];
    if (kind === "sets") return "l";
    const real = PROP_LOWER[n.toLowerCase()];
    return real ? PROP_TYPES[real] : null;
  };
  name.addEventListener("input", () => {
    const k = known();
    if (k) type.value = k === "a" ? "o" : k;
    const real = kind === "props" || kind === "free" ? PROP_LOWER[name.value.trim().toLowerCase()] : null;
    hint.textContent = name.value.trim() && kind !== "sets" && kind !== "slotProps" && !real ? "SPT 속성 목록에 없는 이름 (오타 확인)" : (real && KEY_LABELS[real] ? KEY_LABELS[real] : "");
  });
  if (kind === "sets") type.style.display = "none";
  const btn = el("button", { class: "small", onclick: () => {
    let n = name.value.trim();
    if (!n) { name.classList.add("invalid"); return; }
    if (kind === "sets" && !/^[A-Za-z0-9_]+$/.test(n)) { toast("묶음 이름은 영문·숫자·_ 만 쓸 수 있습니다"); return; }
    if (kind !== "sets" && kind !== "slotProps") n = PROP_LOWER[n.toLowerCase()] || n;
    if (n in obj) { toast(`'${n}' 은(는) 이미 있습니다`); return; }
    obj[n] = kind === "sets" ? [] : defaultFor(type.value === "o" && known() === "a" ? "a" : type.value);
    markDirty(path); rerender();
  } }, "＋ 추가");
  return el("div", { class: "addrow" }, el("b", null, kind === "sets" ? "묶음 추가" : "값 추가"), name, type, btn, hint);
}

function fileHeader(title, path, extra) {

  const head = el("div", null,

async function show(view, keepScroll) {
  state.view = view;
  const main = document.getElementById("main");
  main.innerHTML = "";
  refreshNavFlags();
  try {
    if (view.kind === "config") await showConfig(main, view.mod);

    else if (view.kind === "newpatch") showNewPatch(main, view.mod);

    else if (view.kind === "generic") await showGeneric(main, view.path);

    main.append(el("div", { class: "note" }, "화면을 그리지 못했습니다: " + e.message));

}

    state.docs[path] = { text: "", trailingNewline: true, dirty: true, isNew: true, error: null, kind: "json", edits: {},
      data: { key: k, title: title.value.trim(), enabled: true, ops: [] } };

    el("div", { class: "card" },
      el("div", { class: "field" }, el("label", null, el("b", null, "연결 키"), "영문·숫자·_ — config.json 과 연결하는 이름, 나중에 못 바꿈"), el("div", null, key), el("span")),

  key.focus();
}

// ----- 패치 화면 -----
async function showPatch(main, path, page, filter) {
  const doc = state.docs[path] || await loadDoc(path);
  const mod = modOf(path);
  const d = doc.data;
  const delBtn = el("button", { class: "danger", onclick: () => deletePatch(path) }, "이 패치 삭제");
  main.append(fileHeader(d?.title || baseName(path), path, delBtn));
  if (doc.error) return;
  main.append(checkBox(path));

  const cfgPath = fileOf(mod, "config.json");
  const cfgDoc = cfgPath ? (state.docs[cfgPath] || await loadDoc(cfgPath)) : null;
  const head = el("div", { class: "card" });
  if (cfgDoc?.data?.patches) {
    const cb = el("input", { type: "checkbox" });

    cb.addEventListener("change", () => { cfgDoc.data.patches[d.key] = cb.checked; markDirty(cfgPath); });
    head.append(el("div", { class: "row" }, el("label", { class: "switch" }, cb, el("span")),

  }
  head.append(objectEditor(path, doc, "data", { skip: new Set(["ops", "sets", "enabled"]) }));
  main.append(head);

  const setCount = d.sets ? Object.keys(d.sets).length : 0;
  const setsCard = el("details", { class: "card", open: setCount > 0 && setCount < 4 },
    el("summary", null, el("b", null, `ID 묶음 ${setCount}개`), el("span", { class: "muted" }, " — 여러 작업에서 같은 ID 목록을 \"@이름\" 으로 쓸 때")));
  if (d.sets) setsCard.append(objectEditor(path, d, "sets", { addKind: "sets", removable: () => true }));
  else setsCard.append(el("div", { class: "tools" }, el("button", { onclick: () => {
    // 파일 안 순서를 key, title, enabled, sets, ops 로 맞춘다
    const ops = d.ops; delete d.ops; d.sets = {}; d.ops = ops;
    markDirty(path); rerender();
  } }, "ID 묶음 쓰기 시작")));
  main.append(setsCard);

  // 작업 추가
  const ops = Array.isArray(d.ops) ? d.ops : (d.ops = []);
  const addCard = el("details", { class: "card", open: ops.length === 0 },
    el("summary", null, el("b", null, "＋ 작업 추가"), el("span", { class: "muted" }, " — 자주 쓰는 작업을 고르거나 종류를 직접 고르세요")));
  const recipes = el("div", { class: "recipes" });
  for (const r of RECIPES) recipes.append(el("button", { onclick: () => addOps(path, r.ops()) }, r.title, el("small", null, r.desc)));
  const kindSel = el("select", null, ...Object.keys(OP_SCHEMA).map(k => el("option", { value: k }, `${OP_NAMES[k]} (${k})`)));
  addCard.append(recipes, el("div", { class: "tools" }, el("span", { class: "muted" }, "종류 직접 고르기:"), kindSel,
    el("button", { onclick: () => addOps(path, [makeOp(kindSel.value)]) }, "추가")));
  main.append(addCard);

  const search = el("input", { type: "text", placeholder: "작업 검색 (ID, 이름, 값…)", value: filter, style: "width:280px" });
  const matches = ops.map((op, i) => ({ op, i })).filter(({ op }) => {
    if (!filter) return true;
    const f = filter.toLowerCase();
    const text = JSON.stringify(op).toLowerCase();
    if (text.includes(f)) return true;
    return JSON.stringify(op).match(/[0-9a-f]{24}/gi)?.some(id => (nameOf(id) || "").toLowerCase().includes(f));
  });
  const pages = Math.max(1, Math.ceil(matches.length / OPS_PER_PAGE));
  page = Math.min(page, pages);
  search.addEventListener("keydown", e => { if (e.key === "Enter") show({ kind: "patch", path, filter: search.value.trim() }); });
  const pager = () => el("span", { class: "row" },
    el("button", { disabled: page <= 1, onclick: () => show({ kind: "patch", path, filter, page: page - 1 }) }, "◀"),
    el("span", { class: "muted" }, `${page} / ${pages} 쪽`),
    el("button", { disabled: page >= pages, onclick: () => show({ kind: "patch", path, filter, page: page + 1 }) }, "▶"));
  main.append(el("div", { class: "tools" }, el("b", null, `작업 ${ops.length}개`), filter ? el("span", { class: "muted" }, `· 검색 결과 ${matches.length}개`) : null,
    search, el("button", { onclick: () => show({ kind: "patch", path, filter: search.value.trim() }) }, "검색"), pages > 1 ? pager() : null));

  for (const { i } of matches.slice((page - 1) * OPS_PER_PAGE, page * OPS_PER_PAGE)) main.append(opCard(path, ops, i));
  if (pages > 1) main.append(el("div", { class: "tools" }, pager()));
}

function addOps(path, newOps) {
  const d = state.docs[path].data;
  d.ops = d.ops || [];
  d.ops.push(...newOps);
  markDirty(path);
  const page = Math.ceil(d.ops.length / OPS_PER_PAGE);
  show({ kind: "patch", path, page }).then(() => {
    const cards = document.querySelectorAll("main .opcard");
    cards[cards.length - newOps.length]?.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  toast(`작업 ${newOps.length}개를 맨 아래에 추가했습니다. 빨간 칸을 채우세요.`);
}

function opCard(path, ops, i) {
  const op = ops[i];
  const mod = modOf(path);
  const schema = OP_SCHEMA[op.op];
  const move = (to) => { if (to < 0 || to >= ops.length) return; [ops[i], ops[to]] = [ops[to], ops[i]]; markDirty(path); rerender(); };
  const dup = () => {
    const copy = JSON.parse(JSON.stringify(op));
    if (copy.newId) copy.newId = newMongoId();
    if (copy.op === "addPreset") { copy.id = newMongoId(); if (copy.preset) copy.preset._id = copy.id; }
    ops.splice(i + 1, 0, copy); markDirty(path); rerender();
    toast(copy.newId ? "복제했습니다. 새 아이템 ID 는 새로 뽑았습니다." : "복제했습니다.");
  };
  const del = () => { if (!confirm(`#${i + 1} ${OP_NAMES[op.op] || op.op} 작업을 지울까요?`)) return; ops.splice(i, 1); markDirty(path); rerender(); };

  const card = el("div", { class: "card opcard" });
  const title = el("h3", null, el("span", { class: "muted" }, `#${i + 1}`), el("span", null, OP_NAMES[op.op] || op.op), el("span", { class: "badge mono" }, op.op),
    op.stage ? el("span", { class: "badge stage-" + op.stage }, VALUE_HINTS.stage[op.stage] || op.stage) : null);
  const who = op.newId || op.id;
  const n = who && nameOf(who);
  if (n) title.append(el("span", { class: "name" }, n));
  title.append(el("span", { class: "grow" }),
    el("button", { class: "small", title: "위로", disabled: i === 0, onclick: () => move(i - 1) }, "↑"),
    el("button", { class: "small", title: "아래로", disabled: i === ops.length - 1, onclick: () => move(i + 1) }, "↓"),
    el("button", { class: "small", onclick: dup }, "복제"),
    el("button", { class: "small danger", onclick: del }, "삭제"));
  card.append(title);
  if (OP_HELP[op.op]) card.append(el("div", { class: "hint", style: "margin:-4px 0 6px" }, OP_HELP[op.op]));

  // 대상 지정 방식
  const skip = new Set(["op"]);
  if (schema?.targets) {
    const cur = TARGET_KEYS.find(k => k in op) || "targets";
    const sel = el("select", null, ...TARGET_KEYS.map(k => { const o = el("option", { value: k }, TARGET_NAMES[k]); if (k === cur) o.selected = true; return o; }));
    sel.addEventListener("change", () => {
      for (const k of TARGET_KEYS) delete op[k];
      // 새 대상 키를 op/stage 바로 뒤에 두려고 순서를 다시 짠다
      const rest = { ...op }; for (const k of Object.keys(op)) delete op[k];
      op.op = rest.op; if (rest.stage) op.stage = rest.stage; delete rest.op; delete rest.stage;
      op[sel.value] = sel.value === "targetsAll" ? true : [];
      Object.assign(op, rest);
      markDirty(path); rerender();
    });
    card.append(el("div", { class: "field" }, el("label", null, el("b", null, "대상 지정 방식")),
      el("div", null, sel, sel.value === "targetsByBaseClass" ? el("div", { class: "hint" }, "예: 탄창 5448bc234bdc2d3c308b4569, 돌격소총 5447b5f14bdc2d61278b4567 — 하위 분류까지 전부 잡힙니다") : null), el("span")));
    if (op.targetsAll === true) skip.add("targetsAll");
  }

  const optional = schema?.optional || {};
  // 속성 값 중 슬롯 목록(Slots 등 객체 목록)·묶음(Prefab 등)은 JSON 으로 편집한다
  const propChild = pk => { const t = PROP_TYPES[PROP_LOWER[pk.toLowerCase()]]; return t === "a" ? { raw: true } : {}; };
  const childOpts = k => {
    if (k === "props") return { childObj: { addKind: "props", removable: () => true, childOpts: propChild } };
    if (k === "slotProps") return { childObj: { addKind: "slotProps", removable: () => true, underscoreFields: true } };
    if (k === "whenPropEquals") return { childObj: { addKind: "props", removable: () => true } };
    if (k === "preset") return { raw: true };
    return {};
  };
  card.append(objectEditor(path, ops, i, {
    skip,
    removable: k => k in optional,
    childOpts,
  }));

  // 선택 항목 추가
  const missing = Object.keys(optional).filter(k => !(k in op));
  if (missing.length) {
    const sel = el("select", null, ...missing.map(k => el("option", { value: k }, `${KEY_LABELS[k] || k} (${k})`)));
    card.append(el("div", { class: "addrow" }, el("b", null, "선택 항목"), sel, el("button", { class: "small", onclick: () => {
      op[sel.value] = JSON.parse(JSON.stringify(optional[sel.value])); markDirty(path); rerender();
    } }, "＋ 추가")));
  }

  if (op.op === "cloneItem" && op.newId) card.append(localeBox(mod, op.newId));
  return card;
}

// 새 아이템의 게임 표시 이름 (모드의 db/locales/global/kr.json · en.json)
function localeBox(mod, id) {
  const box = el("div", { class: "nested", style: "margin-top:8px" }, el("b", null, "게임에 보일 이름"),
    el("span", { class: "muted" }, " — db/locales/global 의 kr.json(한국어) · en.json(영어). 한국어 클라이언트는 kr, 없으면 영어로 보입니다"));
  for (const lang of ["kr", "en"]) {
    const doc = getLocaleDoc(mod, lang, false);
    for (const part of ["Name", "ShortName", "Description"]) {
      const key = `${id} ${part}`;
      const real = doc ? findLocaleKey(doc, key) : key;
      const value = doc?.data?.[real] ?? "";
      const inp = part === "Description"
        ? el("textarea", { rows: 2, style: "font-family:inherit" })
        : el("input", { type: "text", class: "wide" });
      inp.value = value;
      inp.addEventListener("input", () => setLocale(mod, lang, real, inp.value));
      const label = { Name: "이름", ShortName: "짧은 이름", Description: "설명" }[part];
      box.append(el("div", { class: "field" }, el("label", null, el("b", null, `${lang === "kr" ? "한국어" : "영어"} ${label}`), part), inp, el("span")));
    }
    if (!doc) box.append(el("div", { class: "hint" }, `${lang}.json 이 아직 없습니다 — 칸을 채우고 저장하면 새로 만듭니다`));
  }
  return box;
}

async function deletePatch(path) {
  const doc = state.docs[path];
  const mod = modOf(path);
  const key = doc?.data?.key;
  if (!confirm(`'${doc?.data?.title || baseName(path)}' 패치를 삭제할까요?\n파일은 .editor-backup 폴더로 옮겨지고, config.json 목록에서도 빠집니다.`)) return;
  if (!doc.isNew) {
    try { await api("POST", "/api/deletefile?path=" + encodeURIComponent(path)); }
    catch (e) { toast("삭제 실패: " + e.message); return; }
  }
  const createdIds = (doc?.data?.ops || []).filter(o => o.op === "cloneItem" && o.newId).map(o => o.newId);
  delete state.docs[path];
  state.files = state.files.filter(f => f.path !== path);
  const localeChanged = removeLocaleFor(mod, createdIds);
  for (const lp of localeChanged) { const ld = state.docs[lp]; if (ld.isNew && !Object.keys(ld.data).length) { delete state.docs[lp]; state.files = state.files.filter(f => f.path !== lp); } }
  if (!doc.isNew) for (const lp of localeChanged) if (state.docs[lp]?.dirty) { try { await saveDoc(lp); } catch (e) { toast("이름표 정리 실패: " + e.message); } }
  const cfgPath = fileOf(mod, "config.json");
  const cfgDoc = state.docs[cfgPath];
  if (cfgDoc?.data?.patches && key in cfgDoc.data.patches) {
    delete cfgDoc.data.patches[key];
    markDirty(cfgPath);
    // 파일은 이미 지웠으니 config 도 바로 저장해서 서로 맞춘다
    if (!doc.isNew) { try { await saveDoc(cfgPath); } catch (e) { toast("config.json 저장 실패: " + e.message); } }
  }
  refreshSaveBar(); buildNav();
  show({ kind: "config", mod });
  toast("패치를 삭제했습니다" + (doc.isNew ? "" : " (백업 있음)"));
}

async function showPacks(main, path) {
  const doc = await loadDoc(path);
  main.append(fileHeader("아이템 팩 켜기/끄기", path));
  if (doc.error) return;
  doc.data.forEach((pack, i) => {
    if (!pack || typeof pack !== "object") return;
    const card = el("div", { class: "card" });
    if (pack.name) card.append(el("h3", null, pack.name, pack.format ? el("span", { class: "badge" }, pack.format) : null));
    card.append(objectEditor(path, doc.data, i, { skip: new Set(["name"]) }));
    main.append(card);
  });
}

async function showRaw(main, path, back) {
  const doc = state.docs[path] || await loadDoc(path);
  main.append(el("h2", null, "JSON 직접 편집 — " + baseName(path)), el("div", { class: "sub" }, path.replace(/\//g, "\\")));
  main.append(el("div", { class: "note" }, "고급 편집입니다. 쉼표·따옴표 하나만 틀려도 저장되지 않습니다(빨간 테두리). 저장은 아래 [모두 저장] 으로 합니다."));
  const ta = el("textarea", { rows: 32, spellcheck: "false" });
  ta.value = doc.data !== null ? serialize(doc) : doc.text;
  const msg = el("div", { class: "hint bad" });
  ta.addEventListener("input", () => {
    try {
      doc.data = JSON.parse(ta.value); doc.error = null;
      doc.trailingNewline = ta.value.endsWith("\n");
      if (doc.kind === "locale") { doc.kind = "json"; }   // 직접 편집하면 통째로 쓴다
      ta.classList.remove("invalid"); msg.textContent = "";
      markDirty(path);
    } catch (e) { ta.classList.add("invalid"); msg.textContent = "JSON 문법 오류: " + e.message; doc.error = "JSON 문법 오류: " + e.message; refreshSaveBar(); }
  });
  main.append(el("div", { class: "tools" }, back ? el("button", { onclick: () => show(back) }, "← 보기 화면으로") : null), ta, msg);
}

function showBuild(main) {
  main.append(el("h2", null, "빌드 + 배포"),
    el("div", { class: "note" }, "C# 코드를 컴파일해서 SPT 의 user\\mods 폴더에 복사하고, 각 모드 폴더의 release\\ 에 zip 도 만듭니다.\nJSON 만 고쳤다면 빌드할 필요 없습니다 — 저장할 때 SPT 에 바로 적용(설정)이 켜져 있으면 서버 재시작만 하면 됩니다.\n⚠ SPT 서버가 켜져 있으면 DLL 을 덮어쓰지 못하니 서버를 먼저 끄세요."));
  const log = el("pre", { class: "log" }, "아직 실행하지 않았습니다.");
  const btn = el("button", { class: "primary", onclick: async () => {
    if (Object.values(state.docs).some(d => d.dirty) && !confirm("저장 안 된 변경이 있습니다. 저장하지 않은 내용은 빌드에 들어가지 않습니다. 계속할까요?")) return;
    btn.disabled = true; log.textContent = "빌드 중입니다… (처음엔 1~3분 걸립니다)";
    try {
      const r = await api("POST", "/api/build");
      log.textContent = (r.ok ? "✔ 빌드 성공\n\n" : "✖ 빌드 실패\n" + (r.hint ? "→ " + r.hint + "\n" : "") + "\n") + (r.log || "");
    } catch (e) { log.textContent = "빌드 요청 실패: " + e.message; }
    btn.disabled = false; refreshInfo();
  } }, "빌드 시작");
  main.append(el("div", { class: "tools" }, btn, state.info.dotnet ? null : el("span", { class: "hint bad" }, ".NET SDK 가 없습니다 — 'HANA-VI 빌드.bat' 을 먼저 한 번 실행하세요")), log);
}

// ---------------------------------------------------------------------------
// 저장
// ---------------------------------------------------------------------------
async function saveDoc(path) {
  const doc = state.docs[path];
  const text = serialize(doc);
  const r = await api("POST", (doc.isNew ? "/api/newfile?path=" : "/api/file?path=") + encodeURIComponent(path), text);
  doc.text = text; doc.dirty = false; doc.isNew = false; doc.edits = {};
  return r;
}

async function saveAll() {
  const dirty = Object.entries(state.docs).filter(([, d]) => d.dirty);
  if (dirty.some(([, d]) => d.error)) { toast("문법 오류가 있는 파일이 있어 저장하지 않았습니다. 빨간 칸을 고치세요."); return; }
  // 저장 전 검사 — 바뀐 모드의 패치 전부
  const mods = new Set(dirty.map(([p]) => modOf(p)));
  const problems = [];
  for (const mod of mods) {
    for (const p of patchFiles(mod)) for (const e of checkPatch(p).errs) problems.push(`${baseName(p)}: ${e}`);
    for (const e of checkConfig(mod)) problems.push(e);
  }
  if (problems.length && !confirm(`검사에서 오류 ${problems.length}건이 나왔습니다. 이대로면 서버에서 동작하지 않거나 서버가 죽을 수 있습니다.\n\n` +
      problems.slice(0, 12).join("\n") + (problems.length > 12 ? `\n… 외 ${problems.length - 12}건` : "") + "\n\n그래도 저장할까요?")) return;
  // 새 패치 파일을 config 보다 먼저 저장한다 (config 가 없는 파일을 가리키는 순간이 없도록)
  dirty.sort(([a], [b]) => (a.endsWith("config.json") ? 1 : 0) - (b.endsWith("config.json") ? 1 : 0));
  const results = [];
  for (const [path] of dirty) {
    const wasNew = state.docs[path].isNew;
    try {
      const r = await saveDoc(path);
      results.push(`✔ ${baseName(path)}${wasNew ? " (새 파일)" : ""}` + (r.applied ? " → SPT 에도 적용" : "") + (r.applyError ? ` — SPT 적용 실패: ${r.applyError}` : ""));
    } catch (e) { results.push(`✖ ${baseName(path)} — ${e.message}`); }
  }
  refreshSaveBar(); buildNav();
  if (state.view) rerender();
  const applied = results.some(r => r.includes("SPT 에도 적용"));
  toast(results.join("\n") + (applied ? "\n\n서버를 재시작하면 반영됩니다." : ""), 7000);
}

function revertAll() {
  if (!confirm("저장하지 않은 변경을 모두 버릴까요? (아직 저장 안 한 새 패치도 사라집니다)")) return;
  for (const [path, doc] of Object.entries(state.docs)) {
    if (!doc.dirty) continue;
    if (doc.isNew) { delete state.docs[path]; state.files = state.files.filter(f => f.path !== path); continue; }
    try { doc.data = JSON.parse(doc.text); doc.error = null; } catch (e) { doc.error = e.message; }
    doc.trailingNewline = doc.text.endsWith("\n"); doc.dirty = false; doc.edits = {};
    if (isLocalePath(path)) doc.kind = "locale";
  }
  refreshSaveBar(); buildNav();
  const v = state.view;
  if (v && (v.path && !state.docs[v.path])) show({ kind: "config", mod: modOf(v.path) }); else show(v);
}

async function refreshInfo() {
  state.info = await api("GET", "/api/info");
  const i = state.info;
  const deployed = Object.values(i.deployed || {}).filter(Boolean).length;
  document.getElementById("status").textContent =
    `SPT: ${i.sptRoot} ${i.modsDirFound ? `(설치된 모드 ${deployed}개)` : "(폴더 없음 — 경로 설정 필요)"} · 저장 시 SPT 적용 ${i.applyOnSave ? "켜짐" : "꺼짐"}`;
}

});
document.getElementById("btnQuit").onclick = async () => {
  if (Object.values(state.docs).some(d => d.dirty) && !confirm("저장 안 된 변경이 있습니다. 그래도 끌까요?")) return;
  try { await api("POST", "/api/shutdown"); } catch { }
  document.body.innerHTML = "<p style='padding:40px'>편집기를 껐습니다. 이 탭은 닫아도 됩니다.</p>";
};
window.addEventListener("beforeunload", e => { if (Object.values(state.docs).some(d => d.dirty)) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); saveAll(); } });

(async () => {
  document.getElementById("dl-props").append(...Object.keys(PROP_TYPES).sort().map(k => el("option", { value: k }, KEY_LABELS[k] || "")));
  document.getElementById("dl-slotprops").append(...Object.keys(SLOT_PROPS).map(k => el("option", { value: k }, KEY_LABELS[k] || "")));
  try {
    await refreshInfo();
    state.files = (await api("GET", "/api/files")).files;
    await Promise.all(state.files.filter(f => !isLocalePath(f.path)).map(f => loadDoc(f.path).catch(() => null)));
    await loadNames();
    buildNav();
    const first = state.files.find(f => f.path.endsWith("/mod/config.json"));
    if (first) show({ kind: "config", mod: first.mod });
  } catch (e) {
    document.getElementById("main").innerHTML = "";
    document.getElementById("main").append(el("div", { class: "note" }, "편집기 서버와 연결하지 못했습니다: " + e.message + "\n'HANA-VI 설정 편집기.bat' 창이 켜져 있는지 확인하세요."));
  }
})();
